<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="application-version" content="4.2.6">
<meta name="description" content="Gestão financeira e operacional de obras com sincronização segura.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CliqueObras">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://ghxpcclqiabbknzjaapl.supabase.co wss://ghxpcclqiabbknzjaapl.supabase.co; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CliqueObras</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=4.2.6">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=4.2.6">
<link rel="manifest" href="manifest.webmanifest?v=4.2.6">
<meta name="theme-color" content="#18181B">
<link rel="stylesheet" href="css/fonts.css?v=4.2.6">
<script src="assets/vendor/xlsx.min.js?v=4.2.6"></script>
<script src="assets/vendor/chart.min.js?v=4.2.6"></script>
<script src="assets/vendor/lucide.min.js?v=4.2.6"></script>
<script src="assets/vendor/supabase.js?v=2.111.0"></script>
<link rel="stylesheet" href="css/variables.css?v=4.2.6">
<link rel="stylesheet" href="css/layout.css?v=4.2.6">
<link rel="stylesheet" href="css/dashboard.css?v=4.2.6">
<link rel="stylesheet" href="css/tables.css?v=4.2.6">
<link rel="stylesheet" href="css/components.css?v=4.2.6">
<link rel="stylesheet" href="css/auth.css?v=4.2.6">
<link rel="stylesheet" href="css/premium.css?v=4.2.6">
<link rel="stylesheet" href="css/rdo.css?v=4.2.6">
<link rel="stylesheet" href="css/panel-tv.css?v=4.2.6">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <button class="brand" type="button" onclick="App.go('configuracoes')" aria-label="Abrir configurações da empresa" title="Configurações da empresa">
      <div class="brand-logo" id="company-logo-box"><img src="assets/logo-clique.png" alt="Clique Obras"></div>
      <div><b id="sidebar-user-name">CliqueObras</b><small id="sidebar-org-name">Organização</small><span id="company-name" hidden aria-hidden="true"></span></div>
      <i class="brand-chevron" data-lucide="chevron-right"></i>
    </button>
    <nav id="nav">
      <div class="nav-sep">Visão Geral</div>
      <button class="nav-item" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
      <button class="nav-item" data-view="projetos"><i data-lucide="hard-hat"></i>Projetos</button>
      <div class="nav-sep">Gestão</div>
      <button class="nav-item" data-view="orcamentos"><i data-lucide="calculator"></i>Orçamentos</button>
      <button class="nav-item" data-view="financeiro"><i data-lucide="wallet"></i>Financeiro</button>
      <button class="nav-item" data-view="planejamento"><i data-lucide="calendar-days"></i>Planejamento</button>
      <button class="nav-item" data-view="clientes"><i data-lucide="users"></i>Clientes</button>
      <button class="nav-item" data-view="categorias"><i data-lucide="tags"></i>Categorias</button>
      <div class="nav-sep">Execução</div>
      <button class="nav-item" data-view="rdos"><i data-lucide="clipboard-check"></i>Diários de Obra</button>
      <button class="nav-item" data-view="colaboradores"><i data-lucide="users"></i>Colaboradores</button>
      <button class="nav-item" data-view="medicoes"><i data-lucide="dollar-sign"></i>Medições</button>
      <button class="nav-item" data-view="valoreshh"><i data-lucide="badge-dollar-sign"></i>Valores HH</button>
      <div class="nav-sep">Análise</div>
      <button class="nav-item" data-view="basecalculo"><i data-lucide="percent"></i>Base de Cálculo</button>
      <button class="nav-item" data-view="relatorios"><i data-lucide="file-bar-chart"></i>Relatórios</button>
      <div class="nav-sep">Sistema</div>
      <button class="nav-item" data-view="configuracoes"><i data-lucide="settings"></i>Configurações</button>
      <button class="nav-item" data-view="backup"><i data-lucide="database-backup"></i>Backup</button>
      <div class="nav-sep">Conta</div>
      <button class="nav-item nav-logout" id="nav-logout" type="button"><i data-lucide="log-out"></i>Sair</button>
    </nav>
    <div id="sidebar-footer"><span id="storage-status">v4.2.6 · carregando…</span></div>
  </aside>
  <button type="button" id="mobile-menu-backdrop" aria-label="Fechar menu"></button>
  <main>
    <div id="finance-ticker" aria-label="Desempenho financeiro dos projetos"></div>
    <header id="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="menu-toggle" title="Menu" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu"></i></button>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div id="global-search-wrap">
        <i data-lucide="search"></i>
        <input id="global-search" placeholder="Buscar em todo o CliqueObras…" autocomplete="off">
        <button type="button" id="global-search-clear" aria-label="Limpar pesquisa" title="Limpar pesquisa"><i data-lucide="x"></i></button>
        <div id="search-results"></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn tv-mode-toggle" id="tv-mode-toggle" type="button" title="Abrir modo painel para TV" aria-label="Abrir modo painel para TV"><i data-lucide="monitor-up"></i><span>Painel</span></button>
        <button class="icon-btn" id="future-toggle" title="Gastos previstos" aria-label="Abrir gastos previstos"><i data-lucide="calendar-clock"></i></button>
        <button class="icon-btn" id="theme-toggle" title="Alternar tema (Ctrl+D)"><i data-lucide="moon"></i></button>
      </div>
    </header>
    <div id="content-wrap"><div id="content"></div><aside id="rightbar"><div class="rb-title" style="font-size:.8rem;color:var(--text)"><i data-lucide="clock" style="width:15px;height:15px"></i>&nbsp;Gastos Futuros</div><div id="rightbar-content"></div></aside></div>
  </main>
</div>
<div id="modal-overlay"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><div id="loading-msg" style="font-weight:600;color:var(--text2)">Processando…</div></div>
<input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
<input type="file" id="json-input" accept=".json" style="display:none">
<input type="file" id="img-input" accept="image/png,image/jpeg,image/webp" style="display:none">
<script src="config/cloud-config.js?v=4.2.6"></script>
<script src="database/cloud.js?v=4.2.6"></script>
<script src="database/indexeddb.js?v=4.2.6"></script>
<script src="utils/format.js?v=4.2.6"></script>
<script src="utils/helpers.js?v=4.2.6"></script>
<script src="modules/custos/custos.js?v=4.2.6"></script>
<script src="js/importer.js?v=4.2.6"></script>
<script src="js/router.js?v=4.2.6"></script>
<script src="modules/projetos/projetos.js?v=4.2.6"></script>
<script src="modules/orcamentos/orcamentos.js?v=4.2.6"></script>
<script src="modules/planejamento/planejamento.js?v=4.2.6"></script>
<script src="modules/rdo/rdo.js?v=4.2.6"></script>
<script src="modules/medicoes/medicoes.js?v=4.2.6"></script>
<script src="modules/medicoes/fluxocaixa.js?v=4.2.6"></script>
<script src="modules/clientes/clientes.js?v=4.2.6"></script>
<script src="modules/configuracoes/categorias.js?v=4.2.6"></script>
<script src="modules/custos/basecalculo.js?v=4.2.6"></script>
<script src="modules/dashboard/charts.js?v=4.2.6"></script>
<script src="modules/dashboard/panel-tv.js?v=4.2.6"></script>
<script src="modules/compras/compras.js?v=4.2.6"></script>
<script src="modules/dashboard/dashboard.js?v=4.2.6"></script>
<script src="utils/export.js?v=4.2.6"></script>
<script src="modules/relatorios/relatorios.js?v=4.2.6"></script>
<script src="modules/integracoes/omie.js?v=4.2.6"></script>
<script src="modules/configuracoes/configuracoes.js?v=4.2.6"></script>
<script src="js/app.js?v=4.2.6"></script>
<script src="js/auth-ui.js?v=4.2.6"></script>
</body>
</html>
